<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KNN 教材配套习题资源</title>
<style>
  :root{
    --fg:#1f2328; --fg-muted:#656d76; --border:#d0d7de; --border-muted:#d8dee4;
    --bg:#ffffff; --bg-subtle:#f6f8fa; --accent:#0969da;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",
      "PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:32px 24px 80px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  h1{
    font-size:30px;font-weight:600;letter-spacing:-.01em;margin:0 0 10px;
    padding-bottom:12px;border-bottom:1px solid var(--border-muted);
  }
  .lede{color:var(--fg-muted);font-size:15px;margin:14px 0 0;max-width:60ch}
  h2{
    font-size:20px;font-weight:600;margin:40px 0 14px;padding-bottom:8px;
    border-bottom:1px solid var(--border-muted);
  }
  .list{border:1px solid var(--border);border-radius:6px;overflow:hidden}
  a.item{
    display:block;padding:16px;color:inherit;
    border-bottom:1px solid var(--border);transition:background .1s;
  }
  a.item:last-child{border-bottom:none}
  a.item:hover{background:var(--bg-subtle);text-decoration:none}
  .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .name{font-size:16px;font-weight:600;color:var(--accent)}
  .mono{
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    font-size:12px;color:var(--fg-muted);border:1px solid var(--border);
    border-radius:2em;padding:0 8px;line-height:18px;
  }
  .desc{font-size:14px;color:var(--fg-muted);margin:8px 0 0;line-height:1.6}
  .empty{
    border:1px solid var(--border);border-radius:6px;padding:24px;
    text-align:center;color:var(--fg-muted);font-size:14px;
  }
  .foot{
    margin-top:48px;padding-top:20px;border-top:1px solid var(--border-muted);
    font-size:13px;color:var(--fg-muted);display:flex;gap:16px;
    justify-content:space-between;flex-wrap:wrap;
  }
  @media(max-width:640px){
    .wrap{padding:20px 16px 60px}
    h1{font-size:24px}
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>KNN 教材配套习题资源</h1>
  <p class="lede">教材各章习题的数据集与代码骨架存放在本仓库，通过 GitHub Pages 发布。书中的二维码指向对应题目的页面，如链接有变动，以本页为准。</p>

  <h2>第 4 章</h2>
  <div class="list">
    <a class="item" href="p/4-5/">
      <div class="row">
        <span class="name">用 K 近邻回归预测有机污染物的水生急性毒性</span>
        <span class="mono">算法题 4.5</span>
      </div>
      <p class="desc">546 种化合物的分子描述符 → pLC50。手写 KNN、标准化、5 折交叉验证选 K，附自动判分脚本。</p>
    </a>
  </div>

  <h2>说明</h2>
  <p class="desc" style="margin-top:0">数据集来自 UCI Machine Learning Repository，许可为 CC BY 4.0。代码骨架只需 numpy 与 pytest，不需要 sklearn。</p>

  <div class="foot">
    <span>KNN 教材配套习题资源</span>
    <span><a href="https://github.com/Yduidui/knn">GitHub 仓库</a></span>
  </div>

</div>
</body>
</html>
